name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release even without firmware changes"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: an interrupted release would leave a tag without a binary
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pipeline: plan → check → build → test → release. Each job does one
  # thing; without new firmware, build, test and release are skipped. The
  # web installer has its own workflow (pages.yml).

  # ── Decide: is there new firmware? which version? publish? ───────────────
  plan:
    # A PR from a branch of this repository already runs on push; only fork PRs run here
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.plan.outputs.firmware }}
      tests: ${{ steps.plan.outputs.tests }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # history + tags for the diff and the versioning

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE: ${{ inputs.release }}
          # Everything that changes the binary or the published package: sketch,
          # panel CSS/JS, key, linker, core/library versions, compile options
          # and OTA packaging
          FIRMWARE_PATHS: '^([^/]+\.(ino|h)|web/|relay/worker\.mjs|public\.key|ld/|tools/(ota_flash_ld|embed_web|embed_relay|i18n_cm|html_pairs)\.py|\.github/(actions/(setup-arduino|compile)/|scripts/package_ota\.py))'
          # Tests only: runs test, without build or release
          TEST_PATHS: '^(test/|platformio\.ini|requirements\.txt)'
        run: |
          # Highest existing vN tag (numeric sort, no pagination limit)
          last=$(git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          last_tag="v${last:-0}"

          # Compares with the last published tag, not the previous push: a run
          # cancelled in the queue or a failed release does not lose the
          # changes, the next push to main publishes them.
          firmware=false
          tests=false
          if ! git rev-parse -q --verify "refs/tags/$last_tag" >/dev/null; then
            firmware=true
          elif [ "$(git rev-parse "$last_tag^{commit}")" = "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA already published as $last_tag"
          else
            changed=$(git diff --name-only "$last_tag" "$GITHUB_SHA")
            if echo "$changed" | grep -qE "$FIRMWARE_PATHS"; then firmware=true; fi
            if echo "$changed" | grep -qE "$TEST_PATHS"; then tests=true; fi
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            firmware=true
          fi

          release=false
          if [ "$REF" = "refs/heads/main" ] && [ "$firmware" = "true" ] \
             && { [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; }; then
            release=true
          fi

          if [ "$release" = "true" ]; then
            version="v$(( ${last:-0} + 1 ))"
          else
            version="ci-${GITHUB_SHA::7}"
          fi

          {
            echo "firmware=$firmware"
            echo "tests=$tests"
            echo "release=$release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "New firmware: $firmware, tests: $tests, release: $release, version: $version (last tag: $last_tag)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Repository rules (seconds, always) ────────────────────────────────────
  check:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: License header on every source file
        run: python3 tools/license_headers.py --check

      - name: Static analysis (cppcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          tools/static_check.sh

      # The remote access Worker (relay/), on Node with the Workers runtime
      # pieces imitated by the test; 100% coverage, like the firmware
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Relay Worker tests (100% lines/functions/branches)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=relay/worker.mjs
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          relay/worker.test.mjs

      # The same tests on the minified script the firmware uploads
      - name: Relay Worker tests on the embedded (minified) script
        run: |
          python3 tools/embed_relay.py --check --min "$RUNNER_TEMP/worker.min.mjs"
          WORKER="$RUNNER_TEMP/worker.min.mjs" node --test relay/worker.test.mjs

      # The panel's IoT script (the card on Home, the setup form) with the
      # browser imitated; 100% coverage, then the same tests minified
      - name: Panel IoT script tests (100% lines/functions/branches)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=web/iot.js
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          web/iot.test.mjs

      - name: Panel IoT script tests on the minified script
        run: |
          python3 tools/embed_web.py --min-iot "$RUNNER_TEMP/iot.min.js"
          IOT_JS="$RUNNER_TEMP/iot.min.js" node --test web/iot.test.mjs

      # The panel text's decoder (context mixing): the matrix the firmware
      # carries decodes to web/i18n.tsv exactly; 100% coverage, then minified
      - name: Panel text decoder tests (100% lines/functions/branches)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=web/cm.js
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          web/cm.test.mjs

      - name: Panel text decoder tests on the minified script
        run: |
          python3 tools/embed_web.py --min-cm "$RUNNER_TEMP/cm.min.js"
          CM_JS="$RUNNER_TEMP/cm.min.js" node --test web/cm.test.mjs

  # ── Builds the firmware: compiles, measures and packages ─────────────────
  # Runs before the tests: green tests with a firmware over the limit are
  # worth nothing, the device can still hang.
  build:
    needs: [plan, check]
    if: needs.plan.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Embedded CSS and JS (WebAssets.h matches web/)
        run: python3 tools/embed_web.py --check

      - name: Panel HTML pairs (HtmlPairs.h matches the H() texts, which are ASCII)
        run: python3 tools/html_pairs.py --check

      - name: Embedded TLS roots (CloudflareCA.h matches ca/roots.pem)
        run: python3 tools/embed_ca.py --check

      - name: Embedded relay Worker (RelayScript.h matches relay/worker.mjs)
        run: python3 tools/embed_relay.py --check

      - uses: ./.github/actions/setup-arduino

      - uses: ./.github/actions/compile
        with:
          version: ${{ needs.plan.outputs.version }}

      # Project rule: no feature or fix takes the firmware past
      # 500,000 bytes
      - name: Firmware within the 500,000-byte limit
        run: |
          set -o pipefail
          python3 tools/firmware_limit.py build/firmware.raw.bin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check that signature verification was embedded
        run: grep -q "updaterSigningVerifier" build/esp8266-iot.ino.map

      # Throwaway key: only to measure the real size of firmware.signed.bin
      # (gzip + 256 B signature) on every push/PR, without the release secret.
      # Without it, a binary that grows until it almost fills the reserve would
      # pass here and only fail at release, with the production key.
      - name: Generate a test key to measure the signed size
        run: |
          openssl genrsa -out "$RUNNER_TEMP/test.key" 2048
          openssl rsa -in "$RUNNER_TEMP/test.key" -pubout -out "$RUNNER_TEMP/test.pub"

      - name: Package and validate OTA (real size, signed and unsigned)
        run: |
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist \
            --map build/esp8266-iot.ino.map \
            --key "$RUNNER_TEMP/test.key" --pubkey "$RUNNER_TEMP/test.pub" \
            --tag "${{ needs.plan.outputs.version }}"

      # The same generator as the web installer workflow (pages.yml): ESP8266 image, within the
      # maximum sketch and with the version the manifest announces
      - name: Build the web installer (check)
        run: |
          python3 tools/web_installer.py build/firmware.raw.bin \
            "${{ needs.plan.outputs.version }}" "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build/firmware.raw.bin
          retention-days: 14

  # ── Native tests with mandatory 100% coverage ────────────────────────────
  # With new firmware, after the build; with changes only in the tests,
  # without it (build is skipped, and a skipped job does not block this one).
  test:
    needs: [plan, check, build]
    if: >-
      !failure() && !cancelled() &&
      (needs.plan.outputs.firmware == 'true' || needs.plan.outputs.tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'requirements.txt') }}

      - name: Install PlatformIO and gcovr
        run: pip install -r requirements.txt

      - name: Tests + coverage (100% lines/functions/branches)
        run: ./test/coverage.sh

      # Buffer overflow, use after free, leaks and undefined behavior stop
      # the test (coverage catches none of these)
      - name: Tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: pio test -e sanitize

      # Inputs from outside the device (MQTT packets, commands, Cloudflare
      # responses, the ntfy stream, config.json): libFuzzer + ASan + UBSan,
      # 30 s per target, starting from the seeds in test/fuzz/corpus
      - name: Fuzzing
        run: test/fuzz/run.sh 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: fuzzing-findings
          path: .pio/fuzz/*-*-*
          if-no-files-found: ignore

  # ── Signs and publishes (only a push to main with new firmware) ──────────
  release:
    needs: [plan, build, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build

      - name: Sign and validate OTA
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::Secret OTA_SIGNING_KEY is not set; release aborted"
            exit 1
          fi
          key="$RUNNER_TEMP/ota.key"
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$key"
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist --key "$key" \
            --tag "${{ needs.plan.outputs.version }}"
          rm -f "$key"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ESP8266 Firmware ${{ needs.plan.outputs.version }}
          files: |
            dist/firmware.bin
            dist/firmware.signed.bin
            dist/firmware.tagged.bin
          fail_on_unmatched_files: true
