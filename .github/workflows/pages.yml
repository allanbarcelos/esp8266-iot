name: Web installer

# The web installer (ESP Web Tools) on GitHub Pages, on its own, always
# flashing the latest published release (its firmware.bin, the gzip of the
# raw image):
#   - a change to the page or its generator deploys it in seconds, with no
#     firmware build;
#   - after each CI run on main, it deploys again if that run published a
#     newer release than the site has (its manifest.json says which), so a
#     push that changes both ends with the new page and the new firmware.
# Needs Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['install/**', 'tools/web_installer.py', 'FlashLayout.h', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The latest release, and whether the site needs it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          deploy=true
          if [ "$EVENT" = "workflow_run" ]; then
            site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/manifest.json"
            live=$(curl -sSf "$site" | jq -r .version || true)
            if [ "$live" = "$tag" ]; then deploy=false; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Web installer: $tag (deploy: $deploy)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download its firmware
        if: steps.release.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern firmware.bin --dir build

      - name: Build the site
        if: steps.release.outputs.deploy == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 tools/web_installer.py build/firmware.bin "$TAG" site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.release.outputs.deploy == 'true'
        with:
          path: site

      - id: deploy
        if: steps.release.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
